# Managed by uv-ci-template. Weekly, grouped update PRs with Conventional Commit
# messages ("chore(deps): bump ..."), so they pass the commit check in ci.yml.
version: 2
updates:
  - package-ecosystem: uv              # updates pyproject.toml *and* uv.lock
    directory: /
    schedule: { interval: weekly, day: monday }
    groups: { python: { patterns: ["*"] } }
    labels: [dependencies]
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: github-actions  # keeps the pinned action SHAs current
    directory: /
    schedule: { interval: weekly, day: monday }
    groups: { actions: { patterns: ["*"] } }
    labels: [dependencies, ci]
    commit-message: { prefix: ci, include: scope }
  - package-ecosystem: pre-commit
    directory: /
    schedule: { interval: weekly, day: monday }
    groups: { hooks: { patterns: ["*"] } }
    labels: [dependencies, ci]
    commit-message: { prefix: ci, include: scope }
